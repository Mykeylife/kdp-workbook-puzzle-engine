name: KDP Workbook Engine CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  release:
    types: [ published ]

jobs:
  test-pdf-generation:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Test Full Mega Workbook Build (65+ pages)
        run: |
         mkdir -p output
         python cli.py --mode full --out output/test_full.pdf
    
      - name: Test Bilingual Workbook Build
        run: |
          python main.py --mode bilingual --out output/test_bilingual.pdf
          test -s output/test_bilingual.pdf

      - name: Test Screen-Free Coding Workbook Build
        run: |
          python main.py --mode coding --out output/test_coding.pdf
          test -s output/test_coding.pdf

      - name: Verify Streamlit App Syntax
        run: python -m py_compile app.py
